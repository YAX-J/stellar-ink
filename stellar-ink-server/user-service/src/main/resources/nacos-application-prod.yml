# =============================================================
# Nacos 动态配置模板 · 用户服务（生产环境）
#
# 上传：Data ID = user-service-prod.yaml，Group = DEFAULT_GROUP，格式 = YAML
#       入口：Nacos 控制台 → 配置管理 → 配置列表 → 「+」
#             （控制台只绑宿主机回环，用 SSH 隧道开：ssh -L 8848:127.0.0.1:8848 ubuntu@<服务器>）
#
# ⚠️ 可选文件：application-prod.yml 用的是 optional:nacos:... 导入，不建也能启动。
#
# 约定（与网关一致，详见 gateway 的 nacos-application-prod.yml 注释）：
#   · 不放密钥（jwt-secret-key / MySQL 口令 / COS 密钥）、不放 actuator 端点开关、不放路由、不放部署拓扑；
#   · **头像存储开关故意不放在这里**：它与 .env 的 STORAGE_TYPE 是同一项，放两处只会互相打架；
#   · 本文件的值 = 当前 application-prod.yml 的同类取值，发布不改变行为，只是搬到可热更新的位置。
# =============================================================

spring:
  data:
    redis:
      # 登录失败计数、账号锁定、JWT 撤销、公开作者摘要缓存的载体
      timeout: 1s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 池子尺寸；「共享连接」与「验活空闲连接」由 common-core 的
        # RedisLettuceTuningConfig 关/开（不是配置项）。改这里请同步 application-prod.yml。
        pool:
          enabled: true
          max-active: 16
          # 只留一条空闲连接：LIFO 借用保证业务拿到的就是保活心跳刚热过的那条；
          # 并发多出来的连接用完即销毁，不会闲在池里被 NAT 静默丢弃（那是 503 的来源）
          max-idle: 1
          # min-idle 保持 0：预造的空闲连接永远排在第二个位置、借不到，
          # 于是不会被心跳 ping 到，只会闲到被 NAT 丢掉（实测过）
          min-idle: 0
          max-wait: 1s
          time-between-eviction-runs: 30s
  datasource:
    druid:
      # ↓ 跨公网连 MySQL：空闲连接会被 NAT 静默丢弃，必须靠保活把它「用热」
      time-between-eviction-runs-millis: 10000   # 淘汰/保活线程每 10s 跑一次（默认 60s）
      min-evictable-idle-time-millis: 60000      # 空闲 1 分钟就纳入保活（默认 30 分钟太晚）
      keep-alive: true                           # 对池内连接做真 SELECT 1，而不是只看标志位
      keep-alive-between-time-millis: 30000      # 保活间隔 30s（默认 2 分钟；实测 2 分钟仍会被丢）
      # ⚠️ 必须**严格大于** time-between-eviction-runs-millis，否则 Druid 直接抛
      # 「keepAliveBetweenTimeMillis must be greater than timeBetweenEvictionRunsMillis」拒绝建连
      # ⚠️ 这几个键**以代码为准**（common-core DruidKeepAliveConfig）：远端 Nacos 上也有同名键，
      # 会覆盖这里；代码那份还会把生效值打进启动日志，便于核对。
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true                      # 借出时兜底校验（保活正常时不会触发）
      test-on-borrow: false                      # 每次借出都校验要多一个 RTT，保活已够
      test-on-return: false
logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    io.lettuce.core: WARN
    # 临时排查时按需放开：
    # com.stellarink.user: DEBUG
