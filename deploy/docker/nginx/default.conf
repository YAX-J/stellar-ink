# =============================================================================
# 星笺 STELLAR INK 前端 Nginx 配置
# 静态托管 Vue SPA（history 路由）+ 后端 API 反向代理到网关 + 边缘限流
#
# TLS：站点由 Cloudflare 代理，回源用 Cloudflare Origin 证书（SSL/TLS 模式 Full (strict)），
#      并启用 Authenticated Origin Pulls（只接受携带 Cloudflare 客户端证书的回源）。
#      · :80 只保留健康检查与到 https 的跳转（容器 healthcheck 走它，不经 TLS）
#      · :443 是正式站点
#      证书挂载点见 docker-compose.yml：./data/certs → /etc/nginx/origin（证书不进仓库）
# =============================================================================
server_tokens off;

# Cloudflare 真实 IP 还原：必须在下面按 $binary_remote_addr 限流之前生效，
# 否则所有访客共用 CF 边缘 IP，会触发全站 429。
include /etc/nginx/conf.d/cloudflare_real_ip.inc;

# -----------------------------------------------------------------------------
# 限流：Nginx 位于最外层，$binary_remote_addr 取自 TCP 连接、不可伪造，
# 比应用层按 X-Forwarded-For 限流可靠得多（该头可被客户端随意伪造）。
# 阈值按「个人博客 + 单站长」规模设定：明显高于真人操作频率，远低于脚本刷量。
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;    # 登录：防口令爆破
limit_req_zone $binary_remote_addr zone=public_write:10m rate=6r/m;   # 匿名写接口：防刷
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;           # 其余 API：防滥用
limit_req_status 429;

# /notes、/links、/search 同时也是前端 history 路由。浏览器导航带 text/html，
# fetch API 默认是 */*；据此只让页面刷新回退 SPA，不影响同路径 API 请求。
map "$request_method:$http_accept" $spa_navigation {
    default 0;
    ~^GET:.*text/html 1;
}

# -----------------------------------------------------------------------------
# :80 —— 只做两件事：给容器健康检查一个 200；其余一律 301 到 https
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # 容器 healthcheck 用：不经 TLS、不做跳转（见 docker-compose.yml 的 web.healthcheck）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# :443 —— 正式站点（Cloudflare 回源到此）
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    # 如需只接受自己的域名，把 _ 换成：stellar.ink www.stellar.ink
    server_name _;

    # Cloudflare Origin 证书：放在 deploy/docker/data/certs/，文件名固定为下面两个
    ssl_certificate     /etc/nginx/origin/origin.pem;
    ssl_certificate_key /etc/nginx/origin/origin.key;

    # Authenticated Origin Pulls（Cloudflare 的「全局」回源校验）：
    # CA 随镜像提供，客户端证书由 Cloudflare 回源时携带；直连源站 IP 的 443 会在握手阶段被拒。
    # ⚠️ 顺序很重要：先在 Cloudflare 面板打开 Authenticated Origin Pulls，再上线这份配置，
    #    否则握手缺客户端证书，nginx 会对所有请求返回 400。
    ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    # 浏览器看到的是 Cloudflare 的边缘证书；下面这组只用于 CF ↔ 源站
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    error_page 418 = /index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端 API → 网关（前缀与网关路由保持一致）
    # 走变量 + Docker 内置 DNS 动态解析，网关容器重建无需 reload nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 登录 / 注册接口：严格限流（每分钟 10 次，突发 5）
    location = /auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location = /auth/register {
        limit_req zone=auth_login burst=5 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 匿名写接口：回声投瓶 / 友链申请（每分钟 6 次，突发 3）
    location ~ ^/(echos|links)$ {
        if ($spa_navigation) { return 418; }
        limit_req zone=public_write burst=3 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 文章点赞 / 浏览计数 / 笔记浏览：同为公开写接口，同样限流
    location ~ ^/(posts|notes)/\d+/(glow|viewed)$ {
        limit_req zone=public_write burst=3 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 其余 API：适度限流（正常浏览的请求密度远低于此）
    location ~ ^/(auth|user|posts|notes|tags|search|meteors|echos|links|stats)(/|$) {
        if ($spa_navigation) { return 418; }
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 用户头像等上传文件（user-service 静态映射提供）：同样走网关，匿名可读。
    # 放在静态资源正则之前，否则 .png/.jpg 会被下面的 30 天长缓存规则截走 → 404
    location ~ ^/uploads/ {
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 带指纹的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
