# 开发环境配置（AI 业务服务）
#
# 数据源只用于 ai_* 表（模型配置、评测数据）；AI 不读写 user / post 等业务表。
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 导入Nacos配置（可选，未上传不影响启动）
  cloud:
    nacos:
      # 配置中心
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true
      # 服务发现
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}

  # Redis：**只用于 E3-2 的 AI 配额与并发闸门**（当天调用数 / token 数 / 在飞请求数）。
  # 显式写出来而不是靠 Nacos 下发：Spring Boot 不认 `REDIS_HOST` 这种自定义变量名
  # （只认 `SPRING_DATA_REDIS_HOST`），配置里没有占位符时它会**静默**退回 localhost:6379 ——
  # 容器里的 localhost 不是 Redis，症状是「配额静默失效」而不是报错。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 500ms              # 计数是旁路：超时到点即放行（见 AiUsageServiceImpl 的 fail-open）
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 「共享连接」与「验活空闲连接」由 common-core 的 RedisLettuceTuningConfig 关/开
        pool:
          enabled: true
          max-active: 16
          max-idle: 1             # 只留一条空闲连接：LIFO 借用保证业务拿到心跳刚热过的那条
          min-idle: 0             # 不预造：预造的连接永远排在第二个位置、借不到，只会闲到被丢
          max-wait: 500ms
          time-between-eviction-runs: 30s

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver    # 连接/读超时必须显式给：Connector/J 默认 0 = 无限等，链路抖动时只能等操作系统放弃（Windows 约 21s）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      # ↓ 跨公网连 MySQL：空闲连接会被 NAT 静默丢弃，必须靠保活把它「用热」
      time-between-eviction-runs-millis: 10000   # 淘汰/保活线程每 10s 跑一次（默认 60s）
      min-evictable-idle-time-millis: 60000      # 空闲 1 分钟就纳入保活（默认 30 分钟太晚）
      keep-alive: true                           # 对池内连接做真 SELECT 1，而不是只看标志位
      keep-alive-between-time-millis: 30000      # 保活间隔 30s（默认 2 分钟；实测 2 分钟仍会被丢）
      # ⚠️ 必须**严格大于** time-between-eviction-runs-millis，否则 Druid 直接抛
      # 「keepAliveBetweenTimeMillis must be greater than timeBetweenEvictionRunsMillis」拒绝建连
      # ⚠️ 这几个键**以代码为准**（common-core DruidKeepAliveConfig）：远端 Nacos 上也有同名键，
      # 会覆盖这里；代码那份还会把生效值打进启动日志，便于核对。
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true                      # 借出时兜底校验（保活正常时不会触发）
      test-on-borrow: false                      # 每次借出都校验要多一个 RTT，保活已够
      test-on-return: false
# AI 服务配置
stellar:
  ink:
    # Redis 连接保活心跳：远端 Redis 与本机之间的空闲连接会被 NAT/防火墙**静默**丢弃
    # （实测：重启 11 分钟后第一批请求全部 503/500，而 Redis 那边早就没这条连接了），
    # 30s 一次真 PING 让链路永不空闲；失败就把整池丢掉重建（见 RedisKeepAliveHeartbeat）。
    redis:
      keepalive:
        # E3-2 起本服务真的用 Redis（配额计数），空闲连接被 NAT 静默丢弃后
        # 症状是「配额突然全部放行」——比缓存失效更隐蔽，所以这里必须是 true
        enabled: true
        interval: 30s
    ai:
      # Python 编排服务地址：仅内网可达（不注册 Nacos，浏览器/网关都不应直达 8200）
      python-base-url: ${AI_PYTHON_BASE_URL:http://127.0.0.1:8200}
      # 配额（E3-2）：**额度定义在配置里，计数在 Redis 里**。0 = 不限。
      # 默认值刻意给得宽（开发期要能跑评测：一轮五组策略就是上百次调用），
      # 生产要收紧就改这里或 Nacos 上的同名键，不必改代码。
      quota:
        enabled: ${AI_QUOTA_ENABLED:true}
        daily-calls-per-user: ${AI_QUOTA_DAILY_CALLS_PER_USER:500}
        daily-tokens-per-user: ${AI_QUOTA_DAILY_TOKENS_PER_USER:2000000}
        daily-calls-per-role: ${AI_QUOTA_DAILY_CALLS_PER_ROLE:1000}
        max-concurrent-per-user: ${AI_QUOTA_MAX_CONCURRENT_PER_USER:4}
        inflight-ttl-seconds: 300

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL（dev）

# Sa-Token：服务内防御性复核（主门槛在网关；M1 才接入 /ai/** 路由）
sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  # JWT 密钥（必须与网关一致）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  timeout: 604800
  is-concurrent: true
  is-share: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html

# Actuator端点暴露 - 用于健康检查和配置验证
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # 安全：高危端点显式关闭（即使被误加回 exposure 也不会开启）
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
