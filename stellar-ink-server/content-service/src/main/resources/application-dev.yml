# 内容服务开发环境配置
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接/读超时必须显式给：Connector/J 默认 0 = 无限等，链路抖动时只能等操作系统放弃（Windows 约 21s）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 10
      max-wait: 5000                    # 拿不到连接最多等 5s：宁可快速失败，也不要把线程挂到 60s
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
      keep-alive-between-time-millis: 120000
      validation-query: SELECT 1
      validation-query-timeout: 3       # 保活探测也要有上限，否则抖动时 SELECT 1 自己先挂住
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 600
      log-abandoned: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 缓存是旁路：读超时到点就该回源，不能让一次网络抖动把请求挂住十几秒。
      # dev 常连远端 Redis（本机 → 服务器），取 500ms；prod 见 application-prod.yml 的 1s。
      timeout: 500ms
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 连接池：一个操作借一条连接、坏连接被淘汰，而不是所有命令挤在一条共享连接上。
        # ⚠️ 光配这里不够：Spring Boot 3.2 的 spring.data.redis.lettuce 下**没有**
        # share-native-connection 这个键，启用池也不会自动关掉共享连接 ——
        # 关掉它、并让池验活空闲连接的是 common-core 的 RedisLettuceTuningConfig（那里有完整理由）。
        # 池生效的前提是 commons-pool2 在 classpath 上（common-core 已引）。
        # 这里只有 Spring Boot 真实存在的键：enabled / max-idle / min-idle / max-active /
        # max-wait / time-between-eviction-runs（不要凭印象加 test-while-idle，那个键不存在）。
        pool:
          enabled: true
          max-active: 16
          # 只留一条空闲连接：LIFO 借用保证业务拿到的就是保活心跳刚热过的那条；
          # 并发多出来的连接用完即销毁，不会闲在池里被 NAT 静默丢弃（那是 503 的来源）
          max-idle: 1
          min-idle: 1
          # 池被借空时的等待上限：宁可快速失败（缓存回源），也不要让请求无限等
          max-wait: 500ms
          # 空闲连接每 30s 跑一次淘汰器；配合 RedisLettuceTuningConfig 的 testWhileIdle
          # 把已经被 NAT/防火墙掐断的连接清出去（否则 idle 后的第一个命令必然等到超时）
          time-between-eviction-runs: 30s

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL（dev）

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # 安全：高危端点显式关闭（即使被误加回 exposure 也不会开启）
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true

sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  timeout: 604800
  is-concurrent: true
  is-share: true

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    com.zaxxer.hikari: WARN

stellar:
  ink:
    # Redis 连接保活心跳：远端 Redis 与本机之间的空闲连接会被 NAT/防火墙**静默**丢弃
    # （实测：重启 11 分钟后第一批请求全部 503/500，而 Redis 那边早就没这条连接了），
    # 30s 一次真 PING 让链路永不空闲；失败就把整池丢掉重建（见 RedisKeepAliveHeartbeat）。
    redis:
      keepalive:
        enabled: true
        interval: 30s
