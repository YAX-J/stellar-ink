# 生产环境：MySQL 8。先初始化数据库：
#   mysql -u用户 -p 数据库名 < deploy/sql/01_schema.sql
#   mysql -u用户 -p 数据库名 < deploy/sql/02_init-data.sql
# 连接信息全部可用环境变量覆盖，例如远程库：
#   MYSQL_HOST=你的主机 MYSQL_DB=分配的库名 MYSQL_USER=... MYSQL_PASSWORD=... \
#   java -jar stellar-ink-api.jar --spring.profiles.active=mysql
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: never
