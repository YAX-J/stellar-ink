# Nacos 动态配置文件模板 - 用户服务开发环境
# 上传到 Nacos 后的 Data ID：user-service-dev.yaml
# 放在 Nacos 的内容在此维护（可动态调整项）
#
# 安全：jwt-secret-key 绝不要写进本文件！
#   Nacos 配置是共享的 —— 当前 NACOS_AUTH_ENABLE=false，任何能访问 8848 的客户端都能读到；
#   密钥只走环境变量 SA_TOKEN_JWT_SECRET（见 application-dev.yml / application-prod.yml 中的占位符）。

sa-token:
  timeout: 604800
  is-concurrent: true
  is-share: true

# SpringDoc 动态路径（如生产环境关闭 Swagger）
springdoc:
  swagger-ui:
    enabled: true

# 头像上传可调项（改 Nacos 后需重启生效：@ConfigurationProperties 未开 refresh）
stellar:
  ink:
    storage:
      # local 本地磁盘 / cos 腾讯云对象存储 —— 换存储与回滚都只改这一个值
      type: local
      cos:
        bucket: stellar-ink-avatars-1459736092   # 必须带 APPID 后缀
        region: ap-shanghai
        # 对外基址填 CDN 域名；留空则用 COS 默认域名
        public-base: ''
        key-prefix: avatars/
        # 密钥不写在这里：只从环境变量 COS_SECRET_ID / COS_SECRET_KEY 读
    upload:
      public-prefix: /uploads
      avatar-sub-dir: avatars
      avatar-max-bytes: 1048576
