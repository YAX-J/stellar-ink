# 开发环境服务器配置
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 导入Nacos配置（可选，未上传不影响启动）
  cloud:
    # Nacos配置 - 注册中心和配置中心
    nacos:
      # 配置中心
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        file-extension: yaml  # 明确指定为 yaml
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true  # 开启配置动态刷新
      # 服务发现
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}

    # 网关配置
    gateway:
      # 跨域配置：宽松策略，方便前端调试
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH" ]
            allowed-headers: "*"
            max-age: 3600 # 预检请求缓存时间（秒）
      # 服务发现路由：必须保持关闭！
      # 开启后会为每个注册服务自动生成 /{serviceId}/** 路由（如 /content-service/**），
      # 该前缀不在任何显式路由与鉴权白名单内，会绕过网关鉴权直接访问下游（含 /internal/**）。
      # 路由一律在下方 routes 中显式声明。
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true
      # 路由定义（显式声明，保证对外路径稳定）
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**,/user/**
        # 用户头像等上传文件的公开读路径（由 user-service 静态资源映射提供）。
        # 只读：写请求走 /user/avatar，这里不做鉴权 —— 头像图片必须能匿名加载
        - id: user-uploads
          uri: lb://user-service
          predicates:
            - Path=/uploads/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/posts/**,/notes/**,/tags/**,/search/**,/meteors/**,/echos/**,/links/**,/stats/**
        # AI 业务服务：对外唯一入口是 /ai/**；Python（8200）不配路由，只能由 ai-service 内网调用。
        # 公开性/角色门槛在 SaTokenConfigure 里按路径判定（/ai/health 公开，/ai/admin/** 需 ADMIN）
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**

    # Sentinel 限流熔断（规则可在 Nacos 配置中心动态下发）
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      # 网关流控模式（0 表示根据 route 维度限流）
      filter:
        enabled: true

  # JWT 撤销列表由网关直接读取，使用响应式驱动避免阻塞 Netty。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 撤销检查是 fail-closed：超时缩短只是让「Redis 不可达」更快暴露成 503，
      # 不会放行任何已撤销令牌；dev 取 500ms（本机常连远端 Redis），prod 用 1s。
      timeout: 500ms
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 连接池：一个操作借一条连接、坏连接被淘汰，而不是所有命令挤在一条共享连接上。
        # ⚠️ 光配这里不够：Spring Boot 3.2 的 spring.data.redis.lettuce 下**没有**
        # share-native-connection 这个键，启用池也不会自动关掉共享连接 ——
        # 关掉它的是 RedisConnectionTuningConfig 里的 BeanPostProcessor（那里有完整理由）。
        # 另外池生效的前提是 commons-pool2 在 classpath 上（见 pom 的说明）。
        # 这里只有 Spring Boot 真实存在的键：enabled / max-idle / min-idle / max-active /
        # max-wait / time-between-eviction-runs（不要凭印象加 test-while-idle，那个键不存在）。
        pool:
          enabled: true
          max-active: 16
          # 只留一条空闲连接：LIFO 借用保证业务拿到的就是保活心跳刚热过的那条；
          # 并发多出来的连接用完即销毁，不会闲在池里被 NAT 静默丢弃（那是 503 的来源）
          max-idle: 1
          min-idle: 1
          # 池被借空时的等待上限：宁可快速失败（上层转 503），也不要让请求无限等
          max-wait: 500ms
          # 空闲连接每 30s 跑一次淘汰器，把已经死掉的连接清出去
          time-between-eviction-runs: 30s

# 基础不可变配置
sa-token:
  # token名称（同时也是cookie名称）
  token-name: Authorization
  # token 风格
  token-style: uuid
  # 本地开发关闭操作日志
  is-log: false
  # JWT 密钥（必须与各业务服务一致）
  # 安全：此默认值仅供本地联调，3 个服务共用所以不能各自乱改；
  #       生产由环境变量 SA_TOKEN_JWT_SECRET 注入（prod 配置无默认值，缺失即启动失败），
  #       且 common-core 的 SecretGuard 会在 prod 下检测到该默认值直接拒绝启动。
  #       想让本地也走环境变量，可在 deploy/scripts/start-all.bat 或 IDEA 运行配置里设置（两者均已 gitignore）。
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  # token有效期，单位s，设置7天
  timeout: 604800
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号是否共用一个token
  is-share: true

# SpringDoc OpenAPI配置 - API文档路径
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

# Actuator端点暴露
# 安全：绝不使用 include: "*"。下列端点即使被误加回 exposure 也已单独关闭：
#   heapdump   导出堆内存（含 JWT 密钥、DB 口令的明文）—— 脱敏对它无效，最危险
#   env        配置项与生效来源
#   configprops 全部 @ConfigurationProperties
#   beans      类结构
#   threaddump 线程栈
#   shutdown   可直接停服
# 需要临时调整某包日志级别时（写操作需携带有效 token，网关已默认拒绝匿名写）：
# curl -X POST "http://localhost:8080/actuator/loggers/org.springframework.cloud.gateway" \
#   -H "Authorization: <token>" -H "Content-Type: application/json" \
#   -d '{"configuredLevel": "DEBUG"}'
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    io.lettuce.core: WARN
    # 本地同样没起 Sentinel dashboard：心跳失败告警压到 ERROR，避免刷屏掩盖真实错误
    com.alibaba.csp.sentinel.endpoint.SentinelHealthIndicator: ERROR

stellar:
  ink:
    # Redis 连接保活心跳：远端 Redis 与本机之间的空闲连接会被 NAT/防火墙**静默**丢弃
    # （实测：重启 11 分钟后第一批请求全部 503/500，而 Redis 那边早就没这条连接了），
    # 30s 一次真 PING 让链路永不空闲；失败就把整池丢掉重建（见 RedisKeepAliveHeartbeat）。
    redis:
      keepalive:
        enabled: true
        interval: 30s
