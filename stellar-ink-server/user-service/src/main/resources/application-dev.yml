# 开发环境服务器配置
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 导入Nacos配置（可选，未上传不影响启动）
  cloud:
    nacos:
      # 配置中心
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true
      # 服务发现
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接/读超时必须显式给：Connector/J 默认 0 = 无限等，链路抖动时只能等操作系统放弃（Windows 约 21s）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 10
      max-wait: 5000                    # 拿不到连接最多等 5s：宁可快速失败，也不要把线程挂到 60s
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
      keep-alive-between-time-millis: 120000
      validation-query: SELECT 1
      validation-query-timeout: 3       # 保活探测也要有上限，否则抖动时 SELECT 1 自己先挂住
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      remove-abandoned: true
      remove-abandoned-timeout: 600
      log-abandoned: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 缓存/登录锁定都是短路操作：读超时到点就该返回，不跟着网络抖动弹十几秒。
      # dev 常连远端 Redis（本机 → 服务器），取 500ms；prod 见 application-prod.yml 的 1s。
      timeout: 500ms
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms

  # 头像上传：单文件 1MB（业务层同值再校验一次），整个请求 2MB 与 Nginx client_max_body_size 对齐
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

# 头像存储配置
stellar:
  ink:
    # 存储类型开关：local 本地磁盘（默认）/ cos 腾讯云对象存储
    storage:
      type: ${STORAGE_TYPE:local}
      cos:
        # 桶名必须带 APPID 后缀；region 形如 ap-shanghai
        bucket: ${COS_BUCKET:}
        region: ${COS_REGION:ap-shanghai}
        # 对外基址：填 CDN 域名（推荐）。留空则用 COS 默认域名 https://{bucket}.cos.{region}.myqcloud.com
        public-base: ${COS_PUBLIC_BASE:}
        key-prefix: avatars/
        # 密钥刻意不在此配置：只从环境变量 COS_SECRET_ID / COS_SECRET_KEY 读取（见 StorageProperties）
    # 本地磁盘存储（type=local 时生效）
    upload:
      dir: ${UPLOAD_DIR:./data/uploads}
      public-prefix: /uploads
      avatar-sub-dir: avatars
      avatar-max-bytes: 1048576

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL（dev）

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html

# Actuator端点暴露 - 用于健康检查和配置验证
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # 安全：高危端点显式关闭（即使被误加回 exposure 也不会开启）
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true

# Sa-Token 配置
sa-token:
  # token名称（同时也是cookie名称）
  token-name: Authorization
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # JWT 密钥（必须与网关一致）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  # token有效期，单位s 默认30天，-1代表永不过期，设置7天
  timeout: 604800
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号是否共用一个token
  is-share: true

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    com.zaxxer.hikari: WARN
