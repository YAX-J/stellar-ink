# 生产环境配置（AI 业务服务）
#
# 敏感项全部走环境变量，且**不提供默认值**：SA_TOKEN_JWT_SECRET 缺失时应直接启动失败，
# 而不是用开发默认密钥把生产环境签发的 token 变成可伪造的（红线 §7.1）。
server:
  port: 8107

spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 可选：未上传也能启动
  cloud:
    nacos:
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:public}

  # AI 配额与并发闸门的计数（E3-2）。生产里 Redis 由 compose 拉起，服务名就是 redis。
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 1s                 # 命令超时；计数是旁路，到点即放行（fail-open）
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        pool:
          enabled: true
          max-active: 16
          max-idle: 1
          min-idle: 0
          max-wait: 500ms
          time-between-eviction-runs: 30s

  # 只用于 ai_* 表（模型配置、评测数据）；AI 不读写业务表
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:stellar}
    # 必须注入；未设置时 Spring 不保证报错（占位符可能被原样当值），届时表现为连不上生产库
    password: ${MYSQL_PASSWORD}
    druid:
      # ↓ 跨公网连 MySQL：空闲连接会被 NAT 静默丢弃，必须靠保活把它「用热」
      time-between-eviction-runs-millis: 10000   # 淘汰/保活线程每 10s 跑一次（默认 60s）
      min-evictable-idle-time-millis: 60000      # 空闲 1 分钟就纳入保活（默认 30 分钟太晚）
      keep-alive: true                           # 对池内连接做真 SELECT 1，而不是只看标志位
      keep-alive-between-time-millis: 30000      # 保活间隔 30s（默认 2 分钟；实测 2 分钟仍会被丢）
      # ⚠️ 必须**严格大于** time-between-eviction-runs-millis，否则 Druid 直接抛
      # 「keepAliveBetweenTimeMillis must be greater than timeBetweenEvictionRunsMillis」拒绝建连
      # ⚠️ 这几个键**以代码为准**（common-core DruidKeepAliveConfig）：远端 Nacos 上也有同名键，
      # 会覆盖这里；代码那份还会把生效值打进启动日志，便于核对。
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true                      # 借出时兜底校验（保活正常时不会触发）
      test-on-borrow: false                      # 每次借出都校验要多一个 RTT，保活已够
      test-on-return: false
stellar:
  ink:
    # E3-2 起本服务真的用 Redis（配额计数与并发闸门）。生产里 Redis 与应用同机同网，
    # 心跳用不上但留着 —— 一旦部署形态变化它就是现成的保护，代价只是每 30s 几条命令。
    redis:
      keepalive:
        enabled: true
        interval: 30s
    # RAG 语料来源：content-service 的内部只读接口（文章/笔记 → ai_content_snapshot 投影）
    # ⚠️ 显式地址而不是服务发现（name=content-service）：dev/test 共用同一个 Nacos 命名空间，
    #    服务发现可能把本机 ai-service 路由到**测试机**上的实例（另一个库、另一批文章），
    #    表现为「同步过来的语料跟本机库对不上」且日志里没有任何异常。
    content:
      base-url: ${CONTENT_SERVICE_URL:http://content-service:8102}
      # 定时对账式同步：只调 content-service 清单接口 + 写自己的 ai_* 表，不消耗模型额度
      sync-enabled: ${AI_CORPUS_SYNC_ENABLED:true}
      sync-interval-ms: ${AI_CORPUS_SYNC_INTERVAL_MS:300000}
      sync-initial-delay-ms: ${AI_CORPUS_SYNC_INITIAL_DELAY_MS:30000}
    ai:
      # Docker 编排内的服务名；部署时由 compose 注入
      python-base-url: ${AI_PYTHON_BASE_URL:http://stellar-ink-ai:8200}
      # 配额（E3-2）：0 = 不限。生产默认收紧，且全部可用环境变量覆盖（改完不用重新打包）。
      quota:
        enabled: ${AI_QUOTA_ENABLED:true}
        daily-calls-per-user: ${AI_QUOTA_DAILY_CALLS_PER_USER:200}
        daily-tokens-per-user: ${AI_QUOTA_DAILY_TOKENS_PER_USER:1000000}
        daily-calls-per-role: ${AI_QUOTA_DAILY_CALLS_PER_ROLE:500}
        max-concurrent-per-user: ${AI_QUOTA_MAX_CONCURRENT_PER_USER:2}
        inflight-ttl-seconds: 300
sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  # 必须由环境变量提供，与网关/其它服务保持一致。
  # ⚠️ 「缺失即启动失败」是**错的**：实测未设置时 Spring 会把这个字面量 "${SA_TOKEN_JWT_SECRET}"
  #    当密钥照常启动（JCE 预热照样成功）。真正的防线是启动哨兵 SecretGuard
  #    （规则在 shared-model 的 JwtSecretPolicy，非 dev 档生效；网关另有一份 GatewaySecretGuard）。
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET}
  timeout: 604800
  is-concurrent: true
  is-share: true

# 生产不暴露接口文档与调试端点
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false
    prometheus:
      enabled: true
