spring.config.activate.on-profile: mysql

spring:
  datasource:
    # 微服务共享一个 MySQL 库（表归属见 AGENTS.md），生产按服务拆库时改 MYSQL_DB
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: never
