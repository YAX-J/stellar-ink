# 生产环境服务器配置（数据库/密钥等敏感项走环境变量）
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:103.14.33.78:8848}
        namespace: ${NACOS_NAMESPACE:140e3d39-2520-4d07-a08a-f4b2451109c8}  # 命名空间（默认 public）
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:103.14.33.78:8848}
        namespace: ${NACOS_NAMESPACE:140e3d39-2520-4d07-a08a-f4b2451109c8}  # 命名空间（默认 public）
        group: DEFAULT_GROUP

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 必填，无默认值：未设置即启动失败（fail-safe，避免默认放开成通配 "*"）。
            # 多个来源用逗号分隔，如 https://www.example.com,https://example.com
            allowed-origin-patterns: ${GATEWAY_CORS_ORIGINS}
            allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
            allowed-headers: "*"
            max-age: 3600
      # 服务发现路由：必须保持关闭！开启会生成 /{serviceId}/** 自动路由并绕过鉴权（详见 dev 配置注释）
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**,/user/**
        # 头像等上传文件的公开读路径（user-service 静态映射提供，匿名可读）
        - id: user-uploads
          uri: lb://user-service
          predicates:
            - Path=/uploads/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/posts/**,/notes/**,/tags/**,/search/**,/meteors/**,/echos/**,/links/**,/stats/**
        # AI 业务服务：对外唯一入口是 /ai/**；Python（8200）不配路由，只能由 ai-service 内网调用。
        # 公开性/角色门槛在 SaTokenConfigure 里按路径判定（/ai/health 公开，/ai/admin/** 需 ADMIN）
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**

    sentinel:
      eager: true
      transport:
        # 未部署 Sentinel dashboard 时这里连不上，客户端每 15s 重试一次并打 WARN 心跳日志。
        # 这是刻意接受的无害噪音：eager 保持开启，等将来真要接 dashboard 时改 SENTINEL_DASHBOARD 即可，
        # 无需动代码。若嫌日志吵，把下面 logging 里的 SentinelHealthIndicator 调成 ERROR（见文件末尾）。
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 1s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 连接池（与 dev 同尺寸；max-wait 跟随 prod 的 1s 超时）。
        # 撤销校验是 fail-closed：不写 pool 段也能跑，但空闲连接被 NAT 掐断后
        # 第一个带 token 的请求必然 503（下一个又好了）—— 那正是「莫名其妙 503」。
        pool:
          enabled: true
          max-active: 16
          # 只留一条空闲连接：LIFO 借用保证业务拿到的就是保活心跳刚热过的那条；
          # 并发多出来的连接用完即销毁，不会闲在池里被 NAT 静默丢弃（那是 503 的来源）
          max-idle: 1
          # min-idle 保持 0：预造的空闲连接永远排在第二个位置、借不到，
          # 于是不会被心跳 ping 到，只会闲到被 NAT 丢掉（实测过）
          min-idle: 0
          max-wait: 1s
          time-between-eviction-runs: 30s

sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET}
  timeout: 604800
  is-concurrent: true
  is-share: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator

# 生产日志降噪
logging:
  level:
    # 没有 dashboard 时的心跳失败告警（每 15s 一条）——不是故障，压到 ERROR 避免淹没真实告警
    com.alibaba.csp.sentinel.endpoint.SentinelHealthIndicator: ERROR
    # Nacos 客户端在部分网络下的重试日志同样属噪音
    com.alibaba.nacos: WARN

stellar:
  ink:
    # Redis 连接保活心跳：远端 Redis 与本机之间的空闲连接会被 NAT/防火墙**静默**丢弃
    # （实测：重启 11 分钟后第一批请求全部 503/500，而 Redis 那边早就没这条连接了），
    # 30s 一次真 PING 让链路永不空闲；失败就把整池丢掉重建（见 RedisKeepAliveHeartbeat）。
    redis:
      keepalive:
        enabled: true
        interval: 30s
