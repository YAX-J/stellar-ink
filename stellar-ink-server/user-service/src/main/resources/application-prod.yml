# 生产环境服务器配置（敏感项走环境变量）
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:103.14.33.78:8848}
        namespace: ${NACOS_NAMESPACE:140e3d39-2520-4d07-a08a-f4b2451109c8}  # 命名空间（默认 public）
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:103.14.33.78:8848}
        namespace: ${NACOS_NAMESPACE:140e3d39-2520-4d07-a08a-f4b2451109c8}  # 命名空间（默认 public）
        group: DEFAULT_GROUP

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接/读超时必须显式给：默认 0 = 无限等，链路异常时只能等操作系统放弃
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 5000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 1s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms

  # 头像上传：单文件 1MB，整个请求 2MB 与 Nginx client_max_body_size 对齐
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

# 头像存储：容器内固定 /app/data/uploads（type=local 时由 docker-compose 卷挂载持久化）。
# 生产推荐 type=cos：图片与数据库解耦，多实例/重建容器都不丢头像；此时该目录不再使用。
stellar:
  ink:
    storage:
      type: ${STORAGE_TYPE:local}
      cos:
        bucket: ${COS_BUCKET:}
        region: ${COS_REGION:}
        public-base: ${COS_PUBLIC_BASE:}
        key-prefix: avatars/
        # 密钥只从环境变量 COS_SECRET_ID / COS_SECRET_KEY 读取（见 StorageProperties）
    upload:
      dir: ${UPLOAD_DIR:/app/data/uploads}
      public-prefix: /uploads
      avatar-sub-dir: avatars
      avatar-max-bytes: 1048576

sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET}
  timeout: 604800
  is-concurrent: true
  is-share: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
