# 开发环境服务器配置
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 导入Nacos配置（可选，未上传不影响启动）
  cloud:
    # Nacos配置 - 注册中心和配置中心
    nacos:
      # 配置中心
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml  # 明确指定为 yaml
        namespace: ${NACOS_NAMESPACE:}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true  # 开启配置动态刷新
      # 服务发现
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:}

    # 网关配置
    gateway:
      # 跨域配置：宽松策略，方便前端调试
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH" ]
            allowed-headers: "*"
            max-age: 3600 # 预检请求缓存时间（秒）
      # 服务发现路由：必须保持关闭！
      # 开启后会为每个注册服务自动生成 /{serviceId}/** 路由（如 /post-service/**），
      # 该前缀不在任何显式路由与鉴权白名单内，会绕过网关鉴权直接访问下游（含 /internal/**）。
      # 路由一律在下方 routes 中显式声明。
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true
      # 路由定义（显式声明，保证对外路径稳定）
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**,/user/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/posts/**,/tags/**,/search/**
        - id: meteor-service
          uri: lb://meteor-service
          predicates:
            - Path=/meteors/**
        - id: echo-service
          uri: lb://echo-service
          predicates:
            - Path=/echos/**
        - id: link-service
          uri: lb://link-service
          predicates:
            - Path=/links/**
        - id: stats-service
          uri: lb://stats-service
          predicates:
            - Path=/stats/**

    # Sentinel 限流熔断（规则可在 Nacos 配置中心动态下发）
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      # 网关流控模式（0 表示根据 route 维度限流）
      filter:
        enabled: true

# 基础不可变配置
sa-token:
  # token名称（同时也是cookie名称）
  token-name: Authorization
  # token 风格
  token-style: uuid
  # 本地开发关闭操作日志
  is-log: false
  # JWT 密钥（必须与各业务服务一致）
  # 安全：此默认值仅供本地联调，7 个服务共用所以不能各自乱改；
  #       生产由环境变量 SA_TOKEN_JWT_SECRET 注入（prod 配置无默认值，缺失即启动失败），
  #       且 common-core 的 SecretGuard 会在 prod 下检测到该默认值直接拒绝启动。
  #       想让本地也走环境变量，可在 deploy/scripts/start-all.bat 或 IDEA 运行配置里设置（两者均已 gitignore）。
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  # token有效期，单位s，设置7天
  timeout: 604800
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号是否共用一个token
  is-share: true

# SpringDoc OpenAPI配置 - API文档路径
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

# Actuator端点暴露
# 安全：绝不使用 include: "*"。下列端点即使被误加回 exposure 也已单独关闭：
#   heapdump   导出堆内存（含 JWT 密钥、DB 口令的明文）—— 脱敏对它无效，最危险
#   env        配置项与生效来源
#   configprops 全部 @ConfigurationProperties
#   beans      类结构
#   threaddump 线程栈
#   shutdown   可直接停服
# 需要临时调整某包日志级别时（写操作需携带有效 token，网关已默认拒绝匿名写）：
# curl -X POST "http://localhost:8080/actuator/loggers/org.springframework.cloud.gateway" \
#   -H "Authorization: <token>" -H "Content-Type: application/json" \
#   -d '{"configuredLevel": "DEBUG"}'
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    io.lettuce.core: WARN
