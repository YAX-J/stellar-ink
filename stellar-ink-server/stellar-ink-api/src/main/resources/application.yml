server:
  port: 8080

spring:
  application:
    name: stellar-ink
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  file:
    # 相对启动目录，生产可用 --logging.file.name=... 覆盖
    name: logs/stellar-ink.log
  charset:
    console: UTF-8
    file: UTF-8
  logback:
    rollingpolicy:
      file-name-pattern: logs/stellar-ink-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 200MB
  level:
    root: info

stellar:
  jwt:
    # 生产环境务必通过环境变量覆盖：STELLAR_JWT_SECRET
    secret: stellar-ink-dev-secret-please-change-me-32bytes
    expire-hours: 168
