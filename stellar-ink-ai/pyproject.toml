[project]
name = "stellar-ink-ai"
version = "0.1.0"
description = "星笺 AI 编排服务：模型网关、RAG、Agent 与知识管道（仅内网可达）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    # API Key 的静态解密（AES-256-GCM）：与 Java 侧 AesGcmCipher 共用同一套密文格式
    "cryptography>=43.0,<47.0",
    # HTTP 客户端是**运行时**依赖：OpenAI 兼容 Provider 与 Qdrant 适配都要用它。
    # 它曾经只写在 dev 里，而 app/providers/openai_compatible.py 在模块顶层 import httpx ——
    # 生产环境按 main 依赖安装会直接 ImportError（本地装了 dev 所以没暴露）。
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# S105/S106 是「疑似硬编码口令」：本仓库只会硬编码**环境变量名**（如 AI_INTERNAL_SECRET），
# 真实密钥一律只从环境变量读取，因此这两条在本项目恒为误报。
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert（S101 是面向生产代码的规则）
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
# `console` 是 scripts/ 下的同目录模块（不是安装包）：显式登记成 first-party，
# 否则 isort 会把它当成第三方包，与标准库的相对顺序来回摆动、每次 lint 都报 organize imports
known-first-party = ["app", "console"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
exclude = ["^\\.venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
