# 开发环境：H2 内存库（MySQL 兼容模式），启动即建表并注入种子数据，无需安装数据库
spring:
  datasource:
    url: jdbc:h2:mem:stellarink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    com.stellarink: debug
