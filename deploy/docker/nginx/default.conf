# =============================================================================
# 星笺 STELLAR INK 前端 Nginx 配置
# 静态托管 Vue SPA（history 路由）+ 后端 API 反向代理到网关
# =============================================================================
server_tokens off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端 API → 网关（前缀与网关路由保持一致）
    # 走变量 + Docker 内置 DNS 动态解析，网关容器重建无需 reload nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/(auth|user|posts|tags|search|meteors|echos|links|stats)(/|$) {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 带指纹的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
