# 开发环境服务器配置
spring:
  config:
    activate:
      on-profile: dev # 仅在 dev 环境激活
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}  # 导入Nacos配置（可选，未上传不影响启动）
  cloud:
    nacos:
      # 配置中心
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}  # 命名空间（默认 public）
        group: DEFAULT_GROUP
        refresh-enabled: true
      # 服务发现
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:124.221.158.32:8848}
        group: DEFAULT_GROUP
        namespace: ${NACOS_NAMESPACE:f0350c82-5ee7-4eef-86e9-905613ce5902}

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接/读超时必须显式给：Connector/J 默认 0 = 无限等，链路抖动时只能等操作系统放弃（Windows 约 21s）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:stellar_ink}?zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&nullCatalogMeansCurrent=true&connectTimeout=3000&socketTimeout=15000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    druid:
      # ↓ 跨公网连 MySQL：空闲连接会被 NAT 静默丢弃，必须靠保活把它「用热」
      time-between-eviction-runs-millis: 10000   # 淘汰/保活线程每 10s 跑一次（默认 60s）
      min-evictable-idle-time-millis: 30000      # 空闲 30s 就纳入保活（默认 30 分钟太晚）
      keep-alive: true                           # 对池内连接做真 SELECT 1，而不是只看标志位
      keep-alive-between-time-millis: 10000      # 保活间隔 10s（默认 2 分钟；实测 2 分钟仍会被丢）
      # ⚠️ 这几个键**以代码为准**（common-core DruidKeepAliveConfig）：远端 Nacos 上也有同名键，
      # 会覆盖这里；代码那份还会把生效值打进启动日志，便于核对。
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true                      # 借出时兜底校验（保活正常时不会触发）
      test-on-borrow: false                      # 每次借出都校验要多一个 RTT，保活已够
      test-on-return: false
# 头像存储配置
stellar:
  ink:
    # Redis 连接保活心跳：远端 Redis 与本机之间的空闲连接会被 NAT/防火墙**静默**丢弃
    # （实测：重启 11 分钟后第一批请求全部 503/500，而 Redis 那边早就没这条连接了），
    # 30s 一次真 PING 让链路永不空闲；失败就把整池丢掉重建（见 RedisKeepAliveHeartbeat）。
    redis:
      keepalive:
        enabled: true
        interval: 30s
    # 存储类型开关：local 本地磁盘（默认）/ cos 腾讯云对象存储
    storage:
      type: ${STORAGE_TYPE:local}
      cos:
        # 桶名必须带 APPID 后缀；region 形如 ap-shanghai
        bucket: ${COS_BUCKET:}
        region: ${COS_REGION:ap-shanghai}
        # 对外基址：填 CDN 域名（推荐）。留空则用 COS 默认域名 https://{bucket}.cos.{region}.myqcloud.com
        public-base: ${COS_PUBLIC_BASE:}
        key-prefix: avatars/
        # 密钥刻意不在此配置：只从环境变量 COS_SECRET_ID / COS_SECRET_KEY 读取（见 StorageProperties）
    # 本地磁盘存储（type=local 时生效）
    upload:
      dir: ${UPLOAD_DIR:./data/uploads}
      public-prefix: /uploads
      avatar-sub-dir: avatars
      avatar-max-bytes: 1048576

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL（dev）

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

# knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html

# Actuator端点暴露 - 用于健康检查和配置验证
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # 安全：高危端点显式关闭（即使被误加回 exposure 也不会开启）
    env:
      enabled: false
    configprops:
      enabled: false
    beans:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    shutdown:
      enabled: false
    metrics:
      enabled: true
    info:
      enabled: true
    loggers:
      enabled: true

# Sa-Token 配置
sa-token:
  # token名称（同时也是cookie名称）
  token-name: Authorization
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # JWT 密钥（必须与网关一致）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:stellar-ink-satoken-jwt-secret-32bytes}
  # token有效期，单位s 默认30天，-1代表永不过期，设置7天
  timeout: 604800
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 多人登录同一账号是否共用一个token
  is-share: true

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    com.zaxxer.hikari: WARN
