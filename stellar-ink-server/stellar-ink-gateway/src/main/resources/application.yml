server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

stellar:
  jwt:
    # 与各业务服务保持一致；生产用环境变量 STELLAR_JWT_SECRET 覆盖
    secret: stellar-ink-dev-secret-please-change-me-32bytes
    expire-hours: 168

logging:
  file:
    name: logs/stellar-ink-gateway.log
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: info
