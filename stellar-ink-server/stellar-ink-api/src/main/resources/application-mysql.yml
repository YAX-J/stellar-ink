# 生产环境：MySQL 8。首次启动前请手动执行 schema.sql 建库建表（数据种子 data.sql 可选）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stellar_ink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: never
