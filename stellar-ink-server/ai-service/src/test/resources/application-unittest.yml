# 单元/集成测试配置：让集成测试**不依赖任何外部组件**（无 Nacos、无 MySQL、无 Python）。
#
# ⚠️ profile 名是 `unittest`，**不是** `test`，这是刻意的：
#   `test` 已被「测试环境档」占用（`src/main/resources/application-test.yml` —— 部署到测试机时用，
#   会连真实的 Nacos / MySQL）。两者同名时，同名资源只会取 classpath 里第一个（test-classes 排在
#   classes 之前），于是单测与真实测试环境会互相遮蔽 —— 表现是「单测莫名连上真库」或
#   「测试机起来却用了 H2」，两种都不会报错，只会给出错误结论。
#   所以测试代码统一用 `@ActiveProfiles("unittest")`。
#
# 与 application-dev.yml 的区别：dev 会去连远端 Nacos 并注册实例、连开发机 MySQL，
# 测试里那既慢又会在没有数据库的机器上失败；这里换成 H2 内存库 + 关掉注册与配置拉取。
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        # unittest profile 没有 spring.config.import（那是 dev / test / prod 才有），
        # 不关掉校验的话启动会直接报「No spring.config.import property has been defined」
        import-check:
          enabled: false

  datasource:
    # MODE=MySQL：让 H2 接受 mysql 风格的类型与 ` 引号，schema.sql 可以照生产写
    url: jdbc:h2:mem:stellar_ai_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 4
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true

  sql:
    init:
      mode: always          # 每次启动都建表（H2 内存库丢了就没了）
      schema-locations: classpath:test-schema.sql

# 测试用的占位密钥：只在本进程内签验，不得用于任何真实环境
sa-token:
  token-name: Authorization
  jwt-secret-key: test-only-sa-token-jwt-secret-32-bytes
  is-log: false

# 模型配置的默认 provider（测试里不真的调用外网；自检只做 TCP 可达性）
stellar:
  ink:
    ai:
      python-base-url: http://127.0.0.1:8200
      # 配额关闭：测试进程里没有 Redis，开着它会让每条记账路径都去打一次 Redis
      # 再走 fail-open 的 warn 分支 —— 测试仍然绿，但日志会被几十条「跳过配额检查」淹没，
      # 真正的信号反而看不见。配额本身由 AiQuotaPolicyTest / AiUsageQuotaTest 单独覆盖。
      quota:
        enabled: false

logging:
  level:
    root: WARN
    com.stellarink: INFO
    org.springframework: WARN
