<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>星笺 · STELLAR INK — 把思绪挂成星图</title>
<!-- 字体分两路：
     · 拉丁（Space Grotesk / JetBrains Mono）：已自托管，见 src/styles/fonts.css（合计约 205KB，按 unicode-range 分片按需下载）
     · 中文（Noto Sans SC / Noto Serif SC）：单字重 4.4-5.9 MB，不适合进仓库，仍走 Google Fonts；
       用 media=print + onload 改成非阻塞加载，配合 display=swap，首屏先用系统字体渲染再替换。
       域名用 googleapis.cn / gstatic.cn（Google 自家中国域名，内容与 .com 逐字节相同）：
       实测同一份 CSS（gzip 185KB）国内 .cn 0.25-0.28s、.com 0.95-1.13s 且偶发卡到 20s，
       字体分片两边都在 0.12-0.16s。改域名时 preconnect 与 link 必须一起改。 -->
<link rel="preconnect" href="https://fonts.googleapis.cn">
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet"></noscript>
<script>
/* 首屏主题：在任何样式与脚本执行之前落定主题，消除「选过暮色/破晓的用户刷新时先闪一层夜色」。
   未设置过偏好的访客跟随系统（prefers-color-scheme）。与 stores/settings.js 的取值逻辑保持一致。 */
(function () {
  var theme = 'night'
  try {
    var saved = JSON.parse(localStorage.getItem('stellar-ink-settings') || '{}')
    if (saved && saved.theme) theme = saved.theme
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'dawn'
  } catch (e) { /* 存储不可用时用默认夜色 */ }
  document.documentElement.dataset.theme = theme
})()
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
