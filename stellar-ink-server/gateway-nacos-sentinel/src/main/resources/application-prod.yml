# 生产环境服务器配置（数据库/密钥等敏感项走环境变量）
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: DEFAULT_GROUP

    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${GATEWAY_CORS_ORIGINS:*}
            allowed-methods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
            allowed-headers: "*"
            max-age: 3600
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**,/user/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/posts/**,/tags/**,/search/**
        - id: meteor-service
          uri: lb://meteor-service
          predicates:
            - Path=/meteors/**
        - id: echo-service
          uri: lb://echo-service
          predicates:
            - Path=/echos/**
        - id: link-service
          uri: lb://link-service
          predicates:
            - Path=/links/**
        - id: stats-service
          uri: lb://stats-service
          predicates:
            - Path=/stats/**

    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

sa-token:
  token-name: Authorization
  token-style: uuid
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET}
  timeout: 604800
  is-concurrent: true
  is-share: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
