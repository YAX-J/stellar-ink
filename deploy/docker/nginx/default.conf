# =============================================================================
# 星笺 STELLAR INK 前端 Nginx 配置
# 静态托管 Vue SPA（history 路由）+ 后端 API 反向代理到网关 + 边缘限流
# =============================================================================
server_tokens off;

# -----------------------------------------------------------------------------
# 限流：Nginx 位于最外层，$binary_remote_addr 取自 TCP 连接、不可伪造，
# 比应用层按 X-Forwarded-For 限流可靠得多（该头可被客户端随意伪造）。
# 阈值按「个人博客 + 单站长」规模设定：明显高于真人操作频率，远低于脚本刷量。
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;    # 登录：防口令爆破
limit_req_zone $binary_remote_addr zone=public_write:10m rate=6r/m;   # 匿名写接口：防刷
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;           # 其余 API：防滥用
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 后端 API → 网关（前缀与网关路由保持一致）
    # 走变量 + Docker 内置 DNS 动态解析，网关容器重建无需 reload nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 登录接口：严格限流（每分钟 10 次，突发 5）
    location = /auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 匿名写接口：回声投瓶 / 友链申请（每分钟 6 次，突发 3）
    location ~ ^/(echos|links)$ {
        limit_req zone=public_write burst=3 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 文章点赞：同为公开写接口，同样限流
    location ~ ^/posts/\d+/glow$ {
        limit_req zone=public_write burst=3 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 其余 API：适度限流（正常浏览的请求密度远低于此）
    location ~ ^/(auth|user|posts|tags|search|meteors|echos|links|stats)(/|$) {
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # 带指纹的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
