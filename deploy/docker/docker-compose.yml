# =============================================================================
# 星笺 STELLAR INK 生产部署编排（Docker Compose v2）
#
# 拓扑（一台机器整栈自洽，不再依赖宿主机预装任何东西）：
#   web(nginx:80/443，唯一对公网入口) → gateway(:8080，容器内网) → 业务服务(8101-8102)
#   全部 Java 服务 → nacos(:8848/9848 注册与配置) / redis(:6379) ；业务服务 → mysql(:3306)
#   qdrant(:6333) 目前业务未使用，为 AI 阶段（M3 起）预留
#   观测栈：prometheus 用**服务名**从编排内网抓四个 Java 服务的 /actuator/prometheus，
#           grafana 读 prometheus 并只绑宿主机回环（SSH 隧道看板）。
#           两者都不发布公网端口 —— 网关与业务服务的端口本来就没发布，
#           指标抓取不需要它们发布（见 observability/prometheus.yml）。
#
# 三个环境（生产 / 测试 / 本地开发）的关系与网络限制见同目录 README.md 第一节。
#
# =============================================================================
# ⚠️ 两种部署形态（改这个文件之前必须先明确你在哪一种）
# =============================================================================
#   形态 A「整栈自洽」——Nacos / MySQL / Redis / Qdrant **全由本编排拉起**：
#       .env 里必须有 `COMPOSE_PROFILES=selfcontained`
#       生产机（103.14.33.78）是这种。缺了这一行，那四个容器不会启动，
#       应用服务就连不上 nacos:8848 / mysql / redis（域名根本不存在）→ 站点起不来。
#
#   形态 B「中间件在宿主机」——四个中间件跑在宿主机上，本编排**只跑应用层**：
#       .env 里**不要**有 `COMPOSE_PROFILES`（保持未激活），并把
#       NACOS_ADDR / MYSQL_HOST / REDIS_HOST 指向 host.docker.internal
#       测试机（124.221.158.32）是这种。
#
#   为什么需要这个区分（2026-10-09 在测试机上真实踩到，站点断了 20 分钟）：
#   形态 B 的机器上，宿主机已经占着 8848 / 3306 / 6379 / 6333；一旦某个命令让那四个
#   服务参与启动，docker 绑定宿主机端口失败 → **compose 在启动阶段整体中止** →
#   应用容器被创建后留在 `Created`（从没启动），站点直接不可用。
#
#   实现方式：那四个服务带 `profiles: ["selfcontained"]`，而应用服务对它们的
#   `depends_on` 一律带 `required: false` —— ⚠️ 这两个必须**成对出现**：
#   只加 profiles 不加 required 会让整个项目变成
#   `service "gateway" depends on undefined service "nacos": invalid compose project`，
#   于是**每一条** docker compose 命令都报错（实测 Docker Compose v5.5.0）。
#   这正是「形态 B 的机器上普通 `docker compose up -d` 也安全」的原因。
#
# 敏感配置统一放同目录 .env（模板见 .env.example）；首次部署步骤见同目录 README.md。
# 数据落盘：MySQL/Redis/Qdrant/Nacos 用 Docker 具名卷（避免 bind mount 的属主问题），
#          日志/头像/证书用 ./logs、./data/*（都在仓库目录下，已 gitignore）。
#
# ⚠️ mem_limit 的取值规则（踩过一次坑）：**mem_limit ≈ JVM 堆上限 + 300MB 左右的堆外开销**。
#   堆外包括 Metaspace（Spring Boot 3 + MyBatis-Plus + Druid 通常 100MB 上下）、Code Cache、
#   线程栈、直接内存、GC 结构。之前把 Java 服务设成 256m（堆只有 -Xmx128m），结果容器被 cgroup
#   OOM SIGKILL 后由 restart 策略重启，**日志里看不到任何 Java 异常栈**（只有反复启动的记录），
#   极难判断。现在统一 512m；Redis 取同一数值是为 AOF 重写时的 fork + copy-on-write 留余量
#   （其数据仍由 maxmemory 192mb 兜住）。实际占用看 docker stats，8G 机器仍有充足余量。
# =============================================================================
name: stellar-ink

# —— 所有 Java 服务公共环境变量 ——
x-common-env: &common-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: prod
  # Nacos 与 Redis 都在本编排内，直接用服务名访问（改回宿主机服务时填 host.docker.internal）
  NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
  NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
  NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
  SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请在 deploy/docker/.env 中设置 SA_TOKEN_JWT_SECRET}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  # 小内存服务器方案：显式限制堆并使用 SerialGC，避免 JVM 按容器上限预留大堆。
  # 8G 机器上如需放宽，改这里即可（三处共用）：-Xmx256m 起步、上限 mem_limit 到 384m/512m。
  JAVA_OPTS: >-
    -Xms32m
    -Xmx128m
    -XX:+UseSerialGC
    -Dfile.encoding=UTF-8
    -Duser.timezone=Asia/Shanghai

# —— 业务服务的数据基础设施配置 ——
x-db-env: &db-env
  <<: *common-env
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_DB: ${MYSQL_DB:-stellar_ink}
  MYSQL_USER: ${MYSQL_USER:-stellar}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/docker/.env 中设置 MYSQL_PASSWORD}

# —— 后端镜像：共用一个 Dockerfile，仅 JAR_PATH 不同（Maven 全量编译只执行一次）——
x-server-build: &server-build
  context: ../..
  dockerfile: stellar-ink-server/Dockerfile

# —— 从容器内访问宿主机服务（仅当把 MySQL/Redis/Nacos 换回宿主机进程时才需要）——
x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

# —— 健康检查默认参数 ——
x-health: &health-defaults
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 90s

# —— 日志轮转（防止容器日志写满磁盘）——
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# —— 数据卷（具名卷由 Docker 管理，避免 bind mount 后容器内用户无写权限）——
volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  nacos-data:
  # 观测栈的数据卷：Prometheus 的 TSDB（有保留期与容量上限，见下面的启动参数）与 Grafana 的库
  prometheus-data:
  grafana-data:

services:
  # ------------------------------------------------------- 注册/配置中心 Nacos
  nacos:
    # ⚠️ 「整栈自洽」部署专用（见文件头 §两种部署形态）。
    #    跑在**宿主机已提供 Nacos** 的机器上时必须保持未激活 —— 否则它会去抢宿主机
    #    已占用的 8848，compose 在启动阶段直接中止，**连带把整个应用层留在 Created 状态**
    #    （2026-10-09 在测试机上真实踩到：站点断了 20 分钟）。
    profiles: ["selfcontained"]
    image: nacos/nacos-server:v2.4.3
    container_name: stellar-ink-nacos
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      # 单机模式用内置 Derby，无需外部数据库；数据落在 nacos-data 卷
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    ports:
      # 仅绑宿主机回环，方便用 SSH 隧道开控制台：ssh -L 8848:127.0.0.1:8848 <服务器>
      # 容器之间走服务名 nacos:8848 / nacos:9848，不经宿主机端口。
      # ⚠️ 绝不要把 8848/9848 暴露到公网（Nacos 未授权访问是常见入侵入口）。
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
    mem_limit: 900m
    logging: *default-logging

  # -------------------------------------------------------------------- MySQL
  mysql:
    # 同 nacos：宿主机已有 MySQL 时不得激活（3306 会撞）
    profiles: ["selfcontained"]
    image: mysql:8.0
    container_name: stellar-ink-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # root 只用于运维（备份/导入）；业务服务用下面的专用账号
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/docker/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-stellar_ink}
      MYSQL_USER: ${MYSQL_USER:-stellar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/docker/.env 中设置 MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 个人博客规模：256M 缓冲池足够；数据量上来后可调到 512M（8G 机器还有余量）
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空时）自动按文件名顺序执行，建库由 MYSQL_DATABASE 完成。
      # ⚠️ 只挂 01/02：01_schema.sql 已是「当前完整表结构」，03-09 是给早期库做增量升级的，
      #    在全新库上重复执行会报列已存在。
      - ../sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/02_init-data.sql:/docker-entrypoint-initdb.d/02_init-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      # 只绑宿主机回环：公网/安全组都碰不到，仅供本地开发经 SSH 隧道访问：
      #   ssh -L 3306:127.0.0.1:3306 ubuntu@<服务器>
      - "127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306"
    mem_limit: 1g
    logging: *default-logging

  # -------------------------------------------------------------------- Redis
  redis:
    # 同 nacos：宿主机已有 Redis 时不得激活（6379 会撞）
    profiles: ["selfcontained"]
    image: redis:7-alpine
    container_name: stellar-ink-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # appendonly：JWT 撤销列表、登录失败计数需要跨重启保留
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      # 若给 Redis 设了密码，改为：redis-cli -a "$REDIS_PASSWORD" ping
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      # 只绑宿主机回环，供本地开发经 SSH 隧道访问：ssh -L 6379:127.0.0.1:6379 ubuntu@<服务器>
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    mem_limit: 512m
    logging: *default-logging

  # ------------------------------------------------------------------- Qdrant
  qdrant:
    # 同 nacos：宿主机已有 Qdrant（或单独容器）时不得激活（6333 会撞）
    profiles: ["selfcontained"]
    image: qdrant/qdrant:v1.12.4
    container_name: stellar-ink-qdrant
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - qdrant-data:/qdrant/storage
    # 目前业务未使用（AI 阶段 M3 起接入向量检索）
    ports:
      # 只绑宿主机回环，供本地开发/AI 调试经 SSH 隧道访问：ssh -L 6333:127.0.0.1:6333 ubuntu@<服务器>
      - "127.0.0.1:${QDRANT_BIND_PORT:-6333}:6333"
    mem_limit: 512m
    logging: *default-logging

  # -------------------------------------------------------------------- 网关
  gateway:
    build:
      <<: *server-build
      args:
        JAR_PATH: gateway-nacos-sentinel/target/gateway-nacos-sentinel.jar
    image: stellar-ink/gateway:latest
    container_name: stellar-ink-gateway
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      <<: *common-env
      # 必填、无默认值：避免漏配时默认放开通配 "*"
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:?请在 deploy/docker/.env 中设置 GATEWAY_CORS_ORIGINS（如 https://www.example.com）}
    extra_hosts: *extra-hosts
    ports:
      # 安全：仅绑宿主机回环。前端经 web(nginx) 走容器内网 http://gateway:8080，
      # 不经过宿主机端口；把 8080 暴露到公网会让 /actuator/prometheus 等内部指标匿名可达，
      # 且能绕过 nginx 的边缘限流直连网关。需本机调试时用 SSH 隧道：
      #   ssh -L 8080:127.0.0.1:8080 <服务器>
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./logs/gateway:/app/logs
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
    # 安全加固：JVM 只需监听 >1024 的端口，不需要任何 Linux capability；
    # 禁止权限提升，可降低容器逃逸/提权的影响面。日志目录是 bind mount，
    # 容器仍以 root 运行（bind mount 会覆盖镜像内的属主设置），不受影响。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging: *default-logging

  # ---------------------------------------------------------------- 业务服务
  user-service:
    build:
      <<: *server-build
      args:
        JAR_PATH: user-service/target/user-service.jar
    image: stellar-ink/user-service:latest
    container_name: stellar-ink-user-service
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
        required: false
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      <<: *db-env
      # 头像存储：local 用下方卷目录；cos 用腾讯云对象存储（此时卷不再使用，可保留以备回滚）
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_PUBLIC_BASE: ${COS_PUBLIC_BASE:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      # 仅 STORAGE_TYPE=local 时生效的落盘目录（必须是卷挂载点，否则容器重建会丢头像）
      UPLOAD_DIR: /app/data/uploads
    extra_hosts: *extra-hosts
    volumes:
      - ./logs/user-service:/app/logs
      - ./data/uploads:/app/data/uploads
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fs http://localhost:8101/actuator/health || exit 1"]
    # 安全加固：JVM 只需监听 >1024 的端口，不需要任何 Linux capability；
    # 禁止权限提升，可降低容器逃逸/提权的影响面。日志目录是 bind mount，
    # 容器仍以 root 运行（bind mount 会覆盖镜像内的属主设置），不受影响。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging: *default-logging

  content-service:
    build:
      <<: *server-build
      args:
        JAR_PATH: content-service/target/content-service.jar
    image: stellar-ink/content-service:latest
    container_name: stellar-ink-content-service
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
        required: false
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      <<: *db-env
    extra_hosts: *extra-hosts
    volumes:
      - ./logs/content-service:/app/logs
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fs http://localhost:8102/actuator/health || exit 1"]
    # 安全加固：JVM 只需监听 >1024 的端口，不需要任何 Linux capability；
    # 禁止权限提升，可降低容器逃逸/提权的影响面。日志目录是 bind mount，
    # 容器仍以 root 运行（bind mount 会覆盖镜像内的属主设置），不受影响。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging: *default-logging

  # ------------------------------------------------- AI 出口（Java，对外 /ai/**）
  ai-service:
    build:
      <<: *server-build
      args:
        JAR_PATH: ai-service/target/ai-service.jar
    image: stellar-ink/ai-service:latest
    container_name: stellar-ink-ai-service
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
        required: false
    environment:
      TZ: Asia/Shanghai
      # ⚠️ ai-service 的 application-prod.yml 默认值与另外三个服务**不一样**
      #    （Nacos 127.0.0.1 + 命名空间 public + JDBC 默认 mysql，见 AGENTS §2 记的配置债），
      #    所以这里每一项都得显式传，不能靠 yml 里的默认值兜。
      NACOS_ADDR: ${NACOS_ADDR:-host.docker.internal:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-140e3d39-2520-4d07-a08a-f4b2451109c8}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-stellar_ink}
      MYSQL_USER: ${MYSQL_USER:-stellar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/docker/.env 中设置 MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请在 deploy/docker/.env 中设置 SA_TOKEN_JWT_SECRET}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:?请在 deploy/docker/.env 中设置 AI_INTERNAL_SECRET}
      AI_SECRET_MASTER_KEY: ${AI_SECRET_MASTER_KEY:?请在 deploy/docker/.env 中设置 AI_SECRET_MASTER_KEY}
      # Python 也在这个编排里，所以走**服务名**（不是 host.docker.internal）
      AI_PYTHON_BASE_URL: http://stellar-ink-ai:8200
    extra_hosts: *extra-hosts
    volumes:
      - ./logs/ai-service:/app/logs
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fs http://localhost:8107/ai/health || exit 1"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging: *default-logging

  # ---------------------------------- AI 编排（Python，仅内网可达，不发布任何端口）
  stellar-ink-ai:
    build:
      # ⚠️ 必须是**独立的 build context**：根 .dockerignore 里写着 `stellar-ink-ai/`
      #    （后端镜像用不上它），跟着仓库根走的话上下文里根本没有 Python 源码。
      context: ../../stellar-ink-ai
      dockerfile: Dockerfile
    image: stellar-ink/ai-python:latest
    container_name: stellar-ink-ai-python
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 测试/排错期建议 dev（保留 /docs）；prod 会关掉 /docs 与自检接口
      AI_APP_ENV: ${AI_APP_ENV:-dev}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-stellar_ink}
      MYSQL_USER: ${MYSQL_USER:-stellar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/docker/.env 中设置 MYSQL_PASSWORD}
      QDRANT_BASE_URL: ${QDRANT_BASE_URL:-http://host.docker.internal:6333}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:?请在 deploy/docker/.env 中设置 AI_INTERNAL_SECRET}
      AI_SECRET_MASTER_KEY: ${AI_SECRET_MASTER_KEY:?请在 deploy/docker/.env 中设置 AI_SECRET_MASTER_KEY}
      # 打开前必须先建索引（POST /admin/index/rebuild），否则检索命中不到任何内容
      AI_DENSE_STORE_ENABLED: ${AI_DENSE_STORE_ENABLED:-false}
    extra_hosts: *extra-hosts
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3).status == 200 else 1)\""]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    logging: *default-logging

  # -------------------------------------------------------------------- 前端
  web:
    build:
      context: ../..
      dockerfile: stellar-ink-web/Dockerfile
    image: stellar-ink/web:latest
    container_name: stellar-ink-web
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      # :80 只做健康检查与到 https 的 301；:443 是 Cloudflare 回源入口
      # （Cloudflare Origin 证书；安全组只放行你的 IP + Cloudflare 网段，见 README 第五节）
      - "${WEB_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # Cloudflare Origin 证书（固定文件名 origin.pem / origin.key）；data/ 已被 .gitignore 忽略
      - ./data/certs:/etc/nginx/origin:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    logging: *default-logging

  # =============================================================== 观测栈
  # 设计取舍（三条，都是刻意的）：
  #   ① **不抓 Python（stellar-ink-ai :8200）**：它没有 /metrics 端点。
  #      AI 侧的可见性由 ai-service 聚合 ai_call_log + 探测 Python 健康得出
  #      （stellar_ai_daily_* 与 stellar_ai_python_available）。
  #   ② **Prometheus 不写 depends_on**：它必须在服务起不来的时候**仍然活着** ——
  #      若靠 depends_on 等业务服务健康，那「服务挂了要看监控」时监控自己也起不来，
  #      正是最需要它的时刻失效。代价是服务起来之前 up==0，由 2 分钟的 for 兜住。
  #   ③ **Prometheus 不发布端口**：它无鉴权，暴露公网等于公开全部运行指标。
  #      抓取走编排内网服务名；要看 PromQL 控制台就用 SSH 隧道到 Grafana 或直接
  #      `docker compose exec prometheus wget -qO- 'http://localhost:9090/api/v1/targets'`。
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: stellar-ink-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 保留期与容量双上限：单靠时间限制挡不住「基数爆炸把磁盘写满」，
      # 单靠容量限制又会被一次抓取风暴立刻触发淘汰。两个都给。
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      # 允许 POST /-/reload 热加载配置与规则（改完规则不必重建容器）
      - --web.enable-lifecycle
      # 通知通道：启用 Alertmanager 后放开下面这行（见 observability/alertmanager/*.example）
      # - --alertmanager.url=http://alertmanager:9093
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

  # 看板。看板与数据源全部走 file provisioning（见 observability/grafana/provisioning/），
  # 所以界面里点出来的面板活不过一次容器重建 —— 改动请改仓库里的 JSON。
  grafana:
    image: grafana/grafana:11.3.1
    container_name: stellar-ink-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 deploy/docker/.env 中设置 GRAFANA_ADMIN_PASSWORD}
      # 匿名访问与自助注册必须关：看板里有错误率、AI 成本这类只该站长看的东西
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 关掉 Grafana 自己的遥测（它默认会向 grafana.com 发使用统计）
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # 与 Nacos/MySQL/Redis 同口径：只绑宿主机回环，用 SSH 隧道看
      #   ssh -L 3000:127.0.0.1:3000 ubuntu@<服务器>
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    logging: *default-logging

  # ---- 通知通道（默认关闭，启用步骤见 observability/alertmanager/alertmanager.yml.example）----
  # 为什么默认关闭：配置里的接收地址必须由你填，而 Alertmanager **在配置校验失败时
  # 会拒绝启动**（url 为空即失败）—— 挂成默认服务的话，没填地址的人会先遇到
  # 「整栈里有一个容器起不来」。所以在文档里留一步，也不留一个配错就让部署失败的文件。
  # 启用时同时放开上面 prometheus 的 --alertmanager.url 注释行。
  #
  # alertmanager:
  #   image: prom/alertmanager:v0.27.0
  #   container_name: stellar-ink-alertmanager
  #   restart: unless-stopped
  #   command:
  #     - --config.file=/etc/alertmanager/alertmanager.yml
  #     - --storage.path=/alertmanager
  #   volumes:
  #     - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
  #     - ./data/alertmanager:/alertmanager
  #   mem_limit: 64m
  #   logging: *default-logging
