[project]
name = "stellar-ink-ai"
version = "0.1.0"
description = "星笺 AI 编排服务：模型网关、RAG、Agent 与知识管道（仅内网可达）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    # API Key 的静态解密（AES-256-GCM）：与 Java 侧 AesGcmCipher 共用同一套密文格式
    "cryptography>=43.0,<47.0",
]

[project.optional-dependencies]
# 真实模型与向量库依赖在对应里程碑（M2/M3）再引入，M0 全程 Fake Adapter
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert（S101 是面向生产代码的规则）
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
exclude = ["^\\.venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
