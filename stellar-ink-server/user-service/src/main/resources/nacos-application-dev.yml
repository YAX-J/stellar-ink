# =============================================================
# Nacos 动态配置模板 · 用户服务（开发环境）
# 上传：Data ID = user-service-dev.yaml，Group = DEFAULT_GROUP，
#       命名空间 = 与 config/discovery 共用（NACOS_NAMESPACE 指定的那个）
#
# 约定（三个服务一致）：
#   · Nacos 上的键会覆盖本地 application-dev.yml 的同名键 → 本地那份是「Nacos 不可用时的兜底」，
#     改这里请同时改本地文件。
#   · 绝不放：sa-token.jwt-secret-key、MySQL 口令、COS 密钥、actuator 高危端点开关。
#   · 数据源的 url/username/password 由环境变量在本地文件里拼装，不在这里重复。
# =============================================================

spring:
  data:
    redis:
      # 登录失败计数、账号锁定、JWT 撤销、公开作者摘要缓存都走它
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 500ms              # 缓存是旁路：超时到点即回源/返回，不跟着网络抖动弹十几秒
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        # 连接池（键名以 Spring Boot 3.2 为准，没有 test-while-idle）：
        # 「共享连接」与「验活空闲连接」由 common-core 的 RedisLettuceTuningConfig 关/开，
        # 这里只放池子尺寸；改这里请同时改本地 application-dev.yml。
        pool:
          enabled: true
          max-active: 16
          # 只留一条空闲连接：LIFO 借用保证业务拿到的就是保活心跳刚热过的那条；
          # 并发多出来的连接用完即销毁，不会闲在池里被 NAT 静默丢弃（那是 503 的来源）
          max-idle: 1
          # min-idle 保持 0：预造的空闲连接永远排在第二个位置、借不到，
          # 于是不会被心跳 ping 到，只会闲到被 NAT 丢掉（实测过）
          min-idle: 0
          max-wait: 500ms
          time-between-eviction-runs: 30s
  datasource:
    druid:
      # ↓ 跨公网连 MySQL：空闲连接会被 NAT 静默丢弃，必须靠保活把它「用热」
      time-between-eviction-runs-millis: 10000   # 淘汰/保活线程每 10s 跑一次（默认 60s）
      min-evictable-idle-time-millis: 30000      # 空闲 30s 就纳入保活（默认 30 分钟太晚）
      keep-alive: true                           # 对池内连接做真 SELECT 1，而不是只看标志位
      keep-alive-between-time-millis: 10000      # 保活间隔 10s（默认 2 分钟；实测 2 分钟仍会被丢）
      # ⚠️ 这几个键**以代码为准**（common-core DruidKeepAliveConfig）：远端 Nacos 上也有同名键，
      # 会覆盖这里；代码那份还会把生效值打进启动日志，便于核对。
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true                      # 借出时兜底校验（保活正常时不会触发）
      test-on-borrow: false                      # 每次借出都校验要多一个 RTT，保活已够
      test-on-return: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # dev 打印 SQL；生产配置里没有这一行

# 头像存储：切换 local / cos 不需要改代码；密钥只从环境变量 COS_SECRET_ID / COS_SECRET_KEY 读
stellar:
  ink:
    storage:
      type: ${STORAGE_TYPE:local}
      cos:
        bucket: ${COS_BUCKET:}
        region: ${COS_REGION:ap-shanghai}
        public-base: ${COS_PUBLIC_BASE:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger.html

knife4j:
  enable: true
  setting:
    language: zh_cn
    home-custom-path: /doc.html

sa-token:
  # 与网关、content-service 保持一致；jwt-secret-key 不在这里，只从环境变量注入
  token-name: Authorization
  token-style: uuid
  is-log: false
  timeout: 604800        # 7 天（秒）
  is-concurrent: true
  is-share: true

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    com.zaxxer.hikari: WARN
