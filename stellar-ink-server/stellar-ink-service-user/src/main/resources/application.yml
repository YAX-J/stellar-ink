server:
  port: 8101

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:si_user;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

stellar:
  jwt:
    # 与网关保持一致；生产用环境变量 STELLAR_JWT_SECRET 覆盖
    secret: stellar-ink-dev-secret-please-change-me-32bytes
    expire-hours: 168

logging:
  file:
    name: logs/stellar-ink-user.log
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: info
    com.stellarink: debug
