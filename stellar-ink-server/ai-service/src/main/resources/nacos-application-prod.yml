# =============================================================
# Nacos 动态配置模板 · AI 业务服务（生产环境）
#
# 上传：Data ID = ai-service-prod.yaml，Group = DEFAULT_GROUP，格式 = YAML
#       入口：Nacos 控制台 → 配置管理 → 配置列表 → 「+」
#             （控制台只绑宿主机回环，用 SSH 隧道开：ssh -L 8848:127.0.0.1:8848 ubuntu@<服务器>）
#
# ⚠️ 可选文件：application-prod.yml 用的是 optional:nacos:... 导入，不建也能启动。
#
# 约定（与网关、其它服务一致）：
#   · 不放密钥（jwt-secret-key / AI_API_KEY / AI_INTERNAL_SECRET）、
#     不放 actuator 端点开关、不放路由、不放部署拓扑；
#   · ai-service 不拥有业务表、不使用 Redis，所以没有 datasource / redis 段；
#   · 本文件的值 = 当前 application-prod.yml 的同类取值，发布不改变行为，只是搬到可热更新的位置。
# =============================================================

stellar:
  ink:
    # RAG 语料来源：content-service 的内部只读接口（文章/笔记 → ai_content_snapshot 投影）
    # ⚠️ 显式地址而不是服务发现（name=content-service）：dev/test 共用同一个 Nacos 命名空间，
    #    服务发现可能把本机 ai-service 路由到**测试机**上的实例（另一个库、另一批文章），
    #    表现为「同步过来的语料跟本机库对不上」且日志里没有任何异常。
    content:
      base-url: ${CONTENT_SERVICE_URL:http://content-service:8102}
      # 定时对账式同步：只调 content-service 清单接口 + 写自己的 ai_* 表，不消耗模型额度
      sync-enabled: ${AI_CORPUS_SYNC_ENABLED:true}
      sync-interval-ms: ${AI_CORPUS_SYNC_INTERVAL_MS:300000}
      sync-initial-delay-ms: ${AI_CORPUS_SYNC_INITIAL_DELAY_MS:30000}
    ai:
      # 编排网络内的服务名；改这里可热切换 Python 实例（不重启 ai-service）
      python-base-url: ${AI_PYTHON_BASE_URL:http://stellar-ink-ai:8200}
      # 配额（E3-2）：可调项放这里，改完不用重启；计数在 Redis。
      # 生产默认收紧；要临时放开某个额度，改这里比改镜像快得多。
      quota:
        enabled: true
        daily-calls-per-user: 200
        daily-tokens-per-user: 1000000
        daily-calls-per-role: 500
        max-concurrent-per-user: 2

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config: WARN
    # 临时排查时按需放开：
    # com.stellarink.ai: DEBUG
